name: Backend CI

on:
  push:
    branches: [lib]
  pull_request:
    branches: [lib]

jobs:
  pytest:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Run test suite
        env:
          MEALS_TEST_HOST: 127.0.0.1
          MEALS_TEST_PORT: "5432"
        run: python -m pytest -q
